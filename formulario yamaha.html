<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compra Yamaha YZF-R1 | Yamaha Racing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #333333 0%, transparent 25%),
                radial-gradient(circle at 85% 70%, #222222 0%, transparent 25%),
                linear-gradient(135deg, #050505, #151515, #000000);

            color: white;

            overflow-x: hidden;
        }


        /* CABEÇALHO */

        header {

            position: relative;

            z-index: 1;

            background:
                linear-gradient(135deg,
                    #050505,
                    #1c1c1c,
                    #080808);

            padding: 45px 20px;

            text-align: center;

            border-bottom: 2px solid #555;

            box-shadow:
                0 5px 30px rgba(0, 0, 0, 0.8);
        }


        header h1 {

            font-size: 40px;

            letter-spacing: 3px;

            color: #f1f1f1;

            text-shadow:
                0 0 10px #777,
                0 0 25px #333;
        }


        /* MENU */

        nav {

            position: sticky;

            top: 0;

            z-index: 10;

            background:
                rgba(5, 5, 5, 0.97);

            padding: 17px;

            text-align: center;

            border-bottom:
                1px solid #444;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.7);
        }


        nav a {

            color: #ddd;

            text-decoration: none;

            margin: 0 20px;

            font-weight: bold;

            transition: 0.3s;
        }


        nav a:hover {

            color: white;

            text-shadow:
                0 0 10px #888;
        }


        /* CONTAINER */

        .container {

            position: relative;

            z-index: 1;

            max-width: 750px;

            margin: auto;

            padding: 55px 25px;
        }


        /* FORMULÁRIO */

        .formulario {

            background:
                linear-gradient(145deg,
                    rgba(35, 35, 35, 0.97),
                    rgba(8, 8, 8, 0.98));

            padding: 35px;

            border-radius: 20px;

            border:
                1px solid #444;

            box-shadow:
                0 0 25px rgba(0, 0, 0, 0.8),
                0 15px 40px rgba(0, 0, 0, 0.9);

        }


        .formulario h2 {

            text-align: center;

            color: #f1f1f1;

            font-size: 30px;

            margin-bottom: 10px;

            text-shadow:
                0 0 12px #555;
        }


        .subtitulo {

            text-align: center;

            color: #aaa;

            margin-bottom: 30px;

            line-height: 1.6;
        }


        .subtitulo b {

            color: white;

            text-shadow:
                0 0 8px #777;
        }


        /* CAMPOS */

        .campo {

            margin-bottom: 20px;
        }


        .campo label {

            display: block;

            color: #ddd;

            font-weight: bold;

            margin-bottom: 8px;

            text-shadow:
                0 0 5px #333;
        }


        .campo input,
        .campo select,
        .campo textarea {

            width: 100%;

            padding: 14px 16px;

            border-radius: 10px;

            border:
                1px solid #444;

            outline: none;

            background:
                #101010;

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }


        .campo input::placeholder,
        .campo textarea::placeholder {

            color: #777;
        }


        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus {

            border-color: #aaa;

            box-shadow:
                0 0 8px #555,
                0 0 18px rgba(255, 255, 255, 0.08);

            background:
                #151515;
        }


        .campo select option {

            background: #111;

            color: white;
        }


        .campo textarea {

            height: 110px;

            resize: vertical;
        }


        /* LINHAS */

        .linha {

            display: flex;

            gap: 20px;
        }


        .linha .campo {

            flex: 1;
        }


        /* RESUMO */

        .resumo {

            margin: 25px 0;

            padding: 20px;

            border-radius: 12px;

            background:
                #111;

            border:
                1px solid #444;

            box-shadow:
                0 0 15px rgba(0, 0, 0, 0.5);
        }


        .resumo h3 {

            color: white;

            margin-bottom: 12px;

            text-shadow:
                0 0 8px #555;
        }


        .resumo p {

            color: #bbb;

            margin: 7px 0;
        }


        .resumo strong {

            color: #eee;
        }


        /* TERMOS */

        .termos {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin: 20px 0;

            color: #aaa;

            line-height: 1.5;

            font-size: 14px;
        }


        .termos input {

            width: 18px;

            height: 18px;

            accent-color: #777;

            margin-top: 2px;
        }


        /* BOTÃO */

        .btn {

            width: 100%;

            border: none;

            cursor: pointer;

            background:
                linear-gradient(90deg,
                    #222,
                    #555,
                    #222);

            color: white;

            padding: 15px 22px;

            font-size: 16px;

            border-radius: 30px;

            font-weight: bold;

            transition: 0.3s;

            box-shadow:
                0 0 15px rgba(0, 0, 0, 0.8);

            border:
                1px solid #666;
        }


        .btn:hover {

            transform: scale(1.03);

            background:
                linear-gradient(90deg,
                    #333,
                    #777,
                    #333);

            box-shadow:
                0 0 10px #777,
                0 0 25px #444;
        }


        /* BOTÃO VOLTAR */

        .voltar {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #aaa;

            text-decoration: none;

            transition: 0.3s;
        }


        .voltar:hover {

            color: white;

            text-shadow:
                0 0 10px #777;
        }


        /* RODAPÉ */

        footer {

            position: relative;

            z-index: 1;

            text-align: center;

            padding: 30px;

            margin-top: 20px;

            background: #050505;

            color: #777;

            border-top:
                2px solid #333;
        }


        footer strong {

            color: #ddd;

            text-shadow:
                0 0 8px #555;
        }


        /* RESPONSIVO */

        @media (max-width: 700px) {

            header h1 {

                font-size: 28px;
            }


            nav a {

                margin: 0 7px;

                font-size: 13px;
            }


            .container {

                padding: 35px 15px;
            }


            .formulario {

                padding: 22px;
            }


            .linha {

                flex-direction: column;

                gap: 0;
            }

        }
    </style>

</head>


<body>


    <header>

        <h1>Yamaha Racing</h1>

    </header>


    <nav>

        <a href="file:///C:/Users/ALUNO/momos%F0%9F%92%95/site%20principal.html">
            Início
        </a>



    </nav>


    <div class="container">

        <div class="formulario" id="formulario">


            <h2>
                Formulário de Compra
            </h2>


            <p class="subtitulo">

                Preencha seus dados abaixo para demonstrar
                interesse na compra da
                <b>Yamaha YZF-R1</b>.

            </p>


            <form action="#" method="post">


                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                </div>


                <div class="linha">


                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>

                    </div>


                    <div class="campo">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

                    </div>

                </div>


                <div class="linha">


                    <div class="campo">

                        <label for="cpf">
                            CPF
                        </label>

                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>

                    </div>


                    <div class="campo">

                        <label for="nascimento">
                            Data de nascimento
                        </label>

                        <input type="date" id="nascimento" name="nascimento" required>

                    </div>

                </div>


                <div class="campo">

                    <label for="endereco">
                        Endereço
                    </label>

                    <input type="text" id="endereco" name="endereco" placeholder="Rua, número e complemento" required>

                </div>


                <div class="linha">


                    <div class="campo">

                        <label for="cidade">
                            Cidade
                        </label>

                        <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>

                    </div>


                    <div class="campo">

                        <label for="estado">
                            Estado
                        </label>

                        <select id="estado" name="estado" required>

                            <option value="">
                                Selecione
                            </option>

                            <option>AC</option>
                            <option>AL</option>
                            <option>AP</option>
                            <option>AM</option>
                            <option>BA</option>
                            <option>CE</option>
                            <option>DF</option>
                            <option>ES</option>
                            <option>GO</option>
                            <option>MA</option>
                            <option>MT</option>
                            <option>MS</option>
                            <option>MG</option>
                            <option>PA</option>
                            <option>PB</option>
                            <option>PR</option>
                            <option>PE</option>
                            <option>PI</option>
                            <option>RJ</option>
                            <option>RN</option>
                            <option>RS</option>
                            <option>RO</option>
                            <option>RR</option>
                            <option>SC</option>
                            <option>SP</option>
                            <option>SE</option>
                            <option>TO</option>

                        </select>

                    </div>

                </div>


                <div class="campo">

                    <label for="pagamento">
                        Forma de pagamento
                    </label>

                    <select id="pagamento" name="pagamento" required>

                        <option value="">
                            Selecione uma opção
                        </option>

                        <option>
                            À vista
                        </option>

                        <option>
                            Financiamento
                        </option>

                        <option>
                            Cartão de crédito
                        </option>

                        <option>
                            Transferência bancária
                        </option>

                    </select>

                </div>


                <div class="resumo">

                    <h3>
                        Resumo da compra
                    </h3>


                    <p>

                        <strong>Modelo:</strong>
                        Yamaha YZF-R1

                    </p>


                    <p>

                        <strong>Motor:</strong>
                        998cc

                    </p>


                    <p>

                        <strong>Potência:</strong>
                        200 cv

                    </p>


                    <p>

                        <strong>Valor:</strong>
                        R$ 125.000

                    </p>

                </div>


                <div class="campo">

                    <label for="mensagem">
                        Observações
                    </label>

                    <textarea id="mensagem" name="mensagem"
                        placeholder="Digite alguma dúvida ou observação..."></textarea>

                </div>


                <label class="termos">

                    <input type="checkbox" name="termos" required>

                    <span>

                        Declaro que as informações fornecidas
                        são verdadeiras e desejo receber contato
                        da Yamaha Racing sobre a Yamaha YZF-R1.

                    </span>

                </label>


                <button type="submit" class="btn">

                    Enviar formulário de compra

                </button>


            </form>


            <a href="file:///C:/Users/ALUNO/momos%F0%9F%92%95/yamaha%20r1.html" class="voltar">

                ← Voltar para a Yamaha YZF-R1

            </a>


        </div>

    </div>



</body>

</html>
